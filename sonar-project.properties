# Clé unique de votre projet sur SonarCloud (ex: MonOrga_mon-projet)
sonar.projectKey=REPLACE_WITH_YOUR_PROJECT_KEY

# Clé de votre organisation sur SonarCloud
sonar.organization=REPLACE_WITH_YOUR_ORGANIZATION_KEY

# Nom du projet affiché sur SonarCloud
sonar.projectName=promanage-frontend

# URL du serveur SonarCloud
sonar.host.url=https://sonarcloud.io

# Chemin vers les fichiers sources principaux
sonar.sources=src

# Fichiers et dossiers à exclure de l'analyse
sonar.exclusions=**/node_modules/**,**/*.spec.ts,src/assets/**,src/environments/**

# Chemin vers les fichiers de test
sonar.tests=src

# Pattern pour identifier les fichiers de test
sonar.test.inclusions=**/*.spec.ts

# Chemin vers le rapport de couverture de tests (généré par "ng test --code-coverage")
sonar.javascript.lcov.reportPaths=coverage/pfe/lcov.info

# Encodage des fichiers
sonar.sourceEncoding=UTF-8 