<div class="profile-container">
  <h2>Mon profil</h2>
  <div *ngIf="successMessage" class="alert alert-success">{{ successMessage }}</div>
  <div *ngIf="error" class="error">{{ error }}</div>
  <div *ngIf="user">
    <form *ngIf="editMode && isSuperAdmin; else viewMode" class="profile-form">
      <div class="form-group">
        <label for="lastName">Nom</label>
        <input pInputText id="lastName" [(ngModel)]="user.lastName" name="lastName" placeholder="Votre nom" />
      </div>
      <div class="form-group">
        <label for="firstName">Prénom</label>
        <input pInputText id="firstName" [(ngModel)]="user.firstName" name="firstName" placeholder="Votre prénom" />
      </div>
      <div class="form-group">
        <label for="email">Email</label>
        <input pInputText id="email" [(ngModel)]="user.email" name="email" placeholder="Votre email" type="email" />
      </div>
      <div class="profile-actions">
        <p-button 
          label="Enregistrer" 
          icon="pi pi-check" 
          styleClass="p-button-success mr-2 save-btn" 
          (onClick)="saveProfile()" 
          [disabled]="loading">
        </p-button>
        <p-button 
          label="Annuler" 
          icon="pi pi-times" 
          styleClass="p-button-secondary" 
          (onClick)="editMode = false">
        </p-button>
      </div>
    </form>
    <ng-template #viewMode>
      <p><strong>Nom :</strong> {{ user.lastName }}</p>
      <p><strong>Prénom :</strong> {{ user.firstName }}</p>
      <p><strong>Email :</strong> {{ user.email }}</p>
      <p><strong>Rôles :</strong> <span *ngFor="let role of user?.roles; let last = last">{{ role.roleName }}<span *ngIf="!last">, </span></span></p>
      <p-button 
        *ngIf="isSuperAdmin" 
        label="Modifier" 
        icon="pi pi-pencil" 
        styleClass="p-button-primary" 
        (onClick)="enableEdit()">
      </p-button>
    </ng-template>
  </div>
</div>
